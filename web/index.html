<!doctype html>
<html lang="ta">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6f43">
  <title>Velan — வேலன்</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="icon.svg" alt="" width="32" height="32">
      <div>
        <div class="brand-name">Velan</div>
        <div class="brand-sub" data-i18n="tagline">Speak. We'll handle the paperwork.</div>
      </div>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="ta" aria-pressed="true">தமிழ்</button>
      <button data-lang="hi" aria-pressed="false">हिन्दी</button>
      <button data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <main>
    <section id="panels" class="panels"></section>

    <section id="chat" class="chat" aria-live="polite"></section>

    <section class="chips" id="chips" aria-label="Examples"></section>
  </main>

  <footer class="dock">
    <div id="status" class="status" data-i18n="tap">Tap the mic and speak</div>
    <div class="dock-row">
      <button id="speakToggle" class="icon-btn" aria-pressed="true" title="Voice replies">🔊</button>
      <button id="mic" class="mic" aria-label="Speak">
        <svg viewBox="0 0 24 24" width="38" height="38" aria-hidden="true"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
      </button>
      <button id="kbToggle" class="icon-btn" title="Type instead">⌨️</button>
    </div>
    <form id="textForm" class="text-form" hidden>
      <input id="textInput" autocomplete="off" data-i18n-ph="type" placeholder="Type here…">
      <button type="submit" data-i18n="send">Send</button>
    </form>
  </footer>

  <script src="app.js"></script>
</body>
</html>

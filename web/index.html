<!doctype html>
<html lang="ta">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14261A">
  <title>Velan — வேலன்</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Madurai:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Depth, back to front: soft glows → kolam line art → grain → scrim. All decorative. -->
  <div class="bg" aria-hidden="true">
    <div class="bg-art"></div>
    <svg class="bg-kolam" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1200 1600">
      <defs>
        <pattern id="pulli" width="72" height="72" patternUnits="userSpaceOnUse">
          <circle cx="36" cy="36" r="1.7" fill="currentColor"/>
          <path d="M36 8C51 21 51 51 36 64C21 51 21 21 36 8ZM8 36C21 21 51 21 64 36C51 51 21 51 8 36Z" fill="none" stroke="currentColor" stroke-width="1"/>
        </pattern>
      </defs>
      <rect width="1200" height="1600" fill="url(#pulli)"/>
      <g class="rosette" fill="none" stroke="currentColor" stroke-width="1.3">
        <circle cx="960" cy="330" r="110"/><circle cx="960" cy="330" r="180"/><circle cx="960" cy="330" r="260"/>
        <path d="M960 70C1040 170 1040 490 960 590C880 490 880 170 960 70ZM700 330C800 250 1120 250 1220 330C1120 410 800 410 700 330Z"/>
      </g>
    </svg>
    <div class="bg-grain"></div>
    <div class="bg-scrim"></div>
  </div>
  <div class="app">
    <header class="top">
      <div class="brand">
        <svg class="kolam-logo" viewBox="0 0 48 48" aria-hidden="true">
          <g fill="currentColor"><circle cx="12" cy="12" r="2.4"/><circle cx="24" cy="12" r="2.4"/><circle cx="36" cy="12" r="2.4"/><circle cx="12" cy="24" r="2.4"/><circle cx="24" cy="24" r="2.4"/><circle cx="36" cy="24" r="2.4"/><circle cx="12" cy="36" r="2.4"/><circle cx="24" cy="36" r="2.4"/><circle cx="36" cy="36" r="2.4"/></g>
          <path d="M24 4c6 4 6 12 0 16-6-4-6-12 0-16zM24 28c6 4 6 12 0 16-6-4-6-12 0-16zM4 24c4-6 12-6 16 0-4 6-12 6-16 0zM28 24c4-6 12-6 16 0-4 6-12 6-16 0z" fill="none" stroke="currentColor" stroke-width="2"/>
        </svg>
        <div>
          <div class="brand-ta">வேலன்</div>
          <div class="brand-en">Velan</div>
        </div>
      </div>
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="ta" aria-pressed="true">தமிழ்</button>
        <button data-lang="hi" aria-pressed="false">हिन्दी</button>
        <button data-lang="en" aria-pressed="false">EN</button>
      </div>
    </header>

    <div class="kolam-band" aria-hidden="true"></div>

    <section id="task" class="task" hidden></section>

    <main class="stage" id="stage">
      <button id="modeChip" class="mode-chip" hidden></button>

      <div id="home" class="home">
        <p class="hello" data-i18n="helloTitle">வணக்கம்!</p>
        <p class="hello-sub" data-i18n="helloSub">Tap the mic and tell me what you need.</p>
        <div class="tiles" id="tiles"></div>
      </div>

      <div id="talk" class="talk" hidden>
        <div class="said" id="said" hidden></div>
        <div id="cards" class="cards"></div>
        <article class="reply" aria-live="polite">
          <div class="reply-head">
            <span class="avatar" aria-hidden="true">வே</span>
            <span class="reply-name">Velan</span>
            <button id="replay" class="replay" data-i18n-aria="replay" aria-label="Play again">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 5V4L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
            </button>
          </div>
          <p id="replyText" class="reply-text"></p>
          <p id="sources" class="sources" hidden></p>
        </article>
        <div id="confirm" class="confirm" hidden></div>
      </div>
    </main>

    <footer class="dock">
      <div class="live-row">
        <p id="live" class="live" aria-live="polite"></p>
        <button id="speakToggle" class="speak-toggle" aria-pressed="true"></button>
      </div>
      <div class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="dock-row">
        <button id="historyBtn" class="side-btn" data-i18n-aria="history" aria-label="History">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M13 3a9 9 0 0 0-9 9H1l4 4 4-4H6a7 7 0 1 1 2.05 4.95l-1.42 1.42A9 9 0 1 0 13 3zm-1 5v5l4.25 2.52.77-1.28-3.52-2.09V8H12z"/></svg>
          <span data-i18n="historyShort">History</span>
        </button>
        <button id="mic" class="mic" data-i18n-aria="speak" aria-label="Speak">
          <svg class="ring" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="56"/></svg>
          <svg class="mic-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
        </button>
        <button id="kbBtn" class="side-btn" data-i18n-aria="type" aria-label="Type">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20 5H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm-9 3h2v2h-2V8zm0 3h2v2h-2v-2zM8 8h2v2H8V8zm0 3h2v2H8v-2zm-1 2H5v-2h2v2zm0-3H5V8h2v2zm9 7H8v-2h8v2zm0-4h-2v-2h2v2zm0-3h-2V8h2v2zm3 3h-2v-2h2v2zm0-3h-2V8h2v2z"/></svg>
          <span data-i18n="typeShort">Type</span>
        </button>
      </div>
      <form id="textForm" class="text-form" hidden>
        <input id="textInput" autocomplete="off" data-i18n-ph="typeHere" placeholder="Type here…">
        <button type="submit" data-i18n="send">Send</button>
      </form>
    </footer>
  </div>

  <aside id="history" class="sheet" hidden aria-labelledby="historyTitle">
    <div class="sheet-card">
      <div class="sheet-head">
        <h2 id="historyTitle" data-i18n="history">Conversation</h2>
        <button class="close" data-close="history" aria-label="Close">✕</button>
      </div>
      <div id="historyList" class="history-list"></div>
      <button id="newChat" class="btn ghost wide" data-i18n="newChat">Start again</button>
    </div>
  </aside>

  <aside id="formSheet" class="sheet" hidden aria-labelledby="formTitle">
    <div class="sheet-card">
      <div class="sheet-head">
        <h2 id="formTitle"></h2>
        <button class="close" data-close="formSheet" aria-label="Close">✕</button>
      </div>
      <ul id="fieldList" class="field-list"></ul>
      <p class="docs-title" data-i18n="docs">Keep these documents ready</p>
      <ul id="docList" class="doc-list"></ul>
    </div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
